name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint the module
        run: find modules -name '*.php' -print0 | xargs -0 -n1 php -l

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  e2e:
    name: Browser (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: composer install --no-interaction --no-progress
      - run: npm install --no-save puppeteer-core@23
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: node tests/e2e/run.cjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/e2e/shots
