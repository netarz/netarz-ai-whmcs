name: گزارش اشکال (Bug report)
description: افزونه در WHMCS شما کار نمی‌کند یا نتیجهٔ نادرست می‌دهد.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ممنون که گزارش می‌دهید. مشکل حساب، اعتبار یا کلید را این‌جا ننویسید؛ از پنل نِت اَرز تیکت بزنید.
        مشکل امنیتی را هم فقط به dev@netarz.ir بفرستید.
  - type: dropdown
    id: area
    attributes:
      label: کدام بخش؟ (Which part?)
      options:
        - چت آنلاین در ناحیهٔ کاربری (Chat widget)
        - صندوق چت در پنل مدیریت (Staff inbox)
        - پاسخ تیکت (Ticket replies)
        - تنظیمات یا اتصال (Settings / connection)
        - اعتبار و هزینه (Credit and spend)
        - نصب یا به‌روزرسانی (Install / upgrade)
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: چه اتفاقی افتاد؟ (What happened?)
      description: متن کامل خطا، یا آنچه در زبانهٔ «گزارش» افزونه یا Utilities ← Logs ← Module Log دیده می‌شود. کلید را پاک کنید.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: انتظار چه چیزی را داشتید؟ (What did you expect?)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: مراحل بازتولید (Steps to reproduce)
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: environment
    attributes:
      label: محیط اجرا (Environment)
      description: نسخهٔ WHMCS، نسخهٔ PHP، قالب ناحیهٔ کاربری، نسخهٔ افزونه و مدل.
      placeholder: WHMCS 8.13, PHP 8.1, Twenty-One, netarz-ai-whmcs 1.0.0, gpt-4o-mini
    validations:
      required: true
  - type: input
    id: request_id
    attributes:
      label: شناسهٔ درخواست (Request id)
      description: از زبانهٔ «گزارش» افزونه. با این شناسه درخواست را در گزارش‌های نِت اَرز پیدا می‌کنیم.
  - type: checkboxes
    id: no_secrets
    attributes:
      label: پیش از ارسال
      options:
        - label: کلید واقعی و اطلاعات مشتری‌ها را از متن حذف کرده‌ام. (I removed real keys and customer data.)
          required: true
